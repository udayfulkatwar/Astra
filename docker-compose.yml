# ASTRA — one topology for local and cloud (ADR-0007).
#   cp .env.example .env   # fill in secrets
#   docker compose up -d --build
# Services bind to 127.0.0.1 only; in the cloud put a TLS reverse proxy in front (docs/DEPLOYMENT.md).
name: astra

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: astra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: astra
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U astra -d astra']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://astra:${POSTGRES_PASSWORD}@postgres:5432/astra
      ASTRA_OPERATOR_TOKEN: ${ASTRA_OPERATOR_TOKEN:?set ASTRA_OPERATOR_TOKEN in .env}
      ASTRA_AUTOMATION_TOKEN: ${ASTRA_AUTOMATION_TOKEN:?set ASTRA_AUTOMATION_TOKEN in .env}
      ASTRA_VIEWER_TOKEN: ${ASTRA_VIEWER_TOKEN:-}
      ASTRA_CORS_ORIGINS: ${ASTRA_CORS_ORIGINS:-http://localhost:3000}
      ASTRA_LOG_LEVEL: ${ASTRA_LOG_LEVEL:-info}
      ASTRA_SIMULATION: ${ASTRA_SIMULATION:-false}
      # Free chart feeds (ADR-0026), prices only. Default yahoo; set ASTRA_FEEDS= to disable.
      ASTRA_FEEDS: ${ASTRA_FEEDS-yahoo}
      # AI analysis (optional): empty → strategies that require AI take no trades.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # One of six factors required for live execution (ADR-0008). Leave false.
      ASTRA_LIVE_TRADING_AUTHORIZED: ${ASTRA_LIVE_TRADING_AUTHORIZED:-false}
    volumes:
      - ./config:/app/config:ro
    ports:
      - '127.0.0.1:8080:8080'

  dashboard:
    build:
      context: .
      dockerfile: infra/docker/dashboard.Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '127.0.0.1:3000:8080'

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      # Workflows must not read server environment variables (they contain secrets).
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'true'
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./automation/n8n/workflows:/workflows:ro
    ports:
      - '127.0.0.1:5678:5678'

volumes:
  pgdata:
  n8n_data:
