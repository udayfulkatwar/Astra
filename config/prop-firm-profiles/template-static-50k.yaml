# TEMPLATE — NOT A REAL FIRM'S RULES.
# A structurally complete example of a static-drawdown evaluation profile, for PAPER testing.
# Replace every value with your firm's CURRENT published terms, then set
# verification.status: USER_VERIFIED (LIVE mode refuses UNVERIFIED profiles).
id: template-static-50k
name: Template — 50K static drawdown
firm: TEMPLATE (not a real firm)
program: example-evaluation
phase: EVALUATION
version: 1
currency: USD
accountSize: 50000
verification:
  status: UNVERIFIED
  note: Example values only. Verify against your prop firm's current rules.
tradingDayReset:
  timeZone: America/New_York
  time: '17:00'
dailyLoss:
  limit: { kind: PERCENT_OF_INITIAL, value: 2 }
  reference: DAY_START_BALANCE
  measure: EQUITY
  breachConsequence: ACCOUNT_FAILED
maxDrawdown:
  type: STATIC
  limit: { kind: PERCENT_OF_INITIAL, value: 5 }
  measure: EQUITY
  trailingStopsAt: { kind: NEVER }
positionLimits:
  maxContracts: 5
  maxLots: null
  quantityWeights: { MNQ: 0.1 }
  maxOpenPositions: null
  perInstrumentMaxQuantity: {}
  maxLeverage: null
scaling: null
consistency: null
news:
  impactLevels: [HIGH]
  minutesBefore: 2
  minutesAfter: 2
holding:
  overnight: ALLOWED
  weekend: PROHIBITED
  flatBy: null
  weeklyClose: { timeZone: America/New_York, day: FRI, time: '16:00' }
trading:
  stopLossRequired: true
  maxRiskPerTrade: null
  hedgingAllowed: false
objectives:
  profitTarget: { kind: PERCENT_OF_INITIAL, value: 6 }
  minTradingDays: 5
payout: null
