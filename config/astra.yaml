# ASTRA system configuration — engineering parameters, not trading rules.
# Trading rules live in prop-firm-profiles/, risk-policies/ and strategies/.
version: 1

decision:
  # An approval must be executed within this window or it expires.
  approvalTtlSeconds: 30
  freshness:
    quoteMaxAgeMs: 5000
    accountSnapshotMaxAgeMs: 15000
    calendarMaxAgeMs: 3600000
    newsMaxAgeMs: 900000
    aiAnalysisMaxAgeMs: 300000
    maxFutureSkewMs: 2000
  # Max distance between signal entry and executable price.
  maxEntryDeviationTicks: 8
  # No new trades this close to an instrument's scheduled market close (daily break / weekend).
  minMinutesBeforeMarketClose: 10
  # Components that must be healthy for ANY approval.
  requiredComponents: [DATABASE, MARKET_DATA, CALENDAR, EXECUTION, AUTOMATION]
  allowDegradedComponents: false
  # Global default blackout around economic events (merged with strategy and firm rules;
  # the most restrictive wins). DEFAULT — review against your own trading rules.
  eventBlackout:
    impactLevels: [HIGH]
    minutesBefore: 15
    minutesAfter: 15
  news:
    # Becomes true once the news engine (Phase 4) is live.
    required: false
    blockLevels: [HIGH]
  ai:
    minConfidence: 0.6

# Named trading sessions (spec §56). Conventional DEFAULT windows — adjust to your own definitions.
# Strategies restrict themselves with `sessions: [...]`. Windows are local to each time zone (DST-safe);
# `days` are the local days on which a session starts. Note: US/UK DST switch on different dates, so
# the overlap window shifts by an hour for a few weeks a year.
sessions:
  - {
      id: asia,
      name: 'Asia (Tokyo)',
      timeZone: Asia/Tokyo,
      start: '09:00',
      end: '15:00',
      days: [MON, TUE, WED, THU, FRI],
    }
  - {
      id: london,
      name: London,
      timeZone: Europe/London,
      start: '08:00',
      end: '16:30',
      days: [MON, TUE, WED, THU, FRI],
    }
  - {
      id: new-york,
      name: New York,
      timeZone: America/New_York,
      start: '08:00',
      end: '17:00',
      days: [MON, TUE, WED, THU, FRI],
    }
  - {
      id: ny-cash,
      name: US cash equity session,
      timeZone: America/New_York,
      start: '09:30',
      end: '16:00',
      days: [MON, TUE, WED, THU, FRI],
    }
  - {
      id: london-ny-overlap,
      name: London / New York overlap,
      timeZone: America/New_York,
      start: '08:00',
      end: '11:30',
      days: [MON, TUE, WED, THU, FRI],
    }

health:
  # A component whose last report is older than this is UNKNOWN.
  staleAfterMs:
    DATABASE: 30000
    MARKET_DATA: 15000
    NEWS: 900000
    CALENDAR: 3600000
    AI: 300000
    AUTOMATION: 180000
    EXECUTION: 30000
    RISK_ENGINE: 60000
    PROP_FIRM_ADAPTER: 60000
    NOTIFICATIONS: 600000

assembler:
  providerTimeoutMs: 3000

execution:
  confirmationTimeoutMs: 10000
  confirmationPollIntervalMs: 250
  # Automation may execute approvals immediately only in these modes. LIVE always needs an operator.
  autoExecuteModes: [PAPER, SHADOW]

tracking:
  lateObservationThresholdMs: 300000

monitors:
  haltMonitorIntervalMs: 2000
  snapshotPersistIntervalMs: 60000
  # Position monitor alerts (it warns — it never changes orders or closes positions). DEFAULTS.
  positions:
    stopProximityPct: 25 # STOP_NEAR when ≤ 25% of the initial stop distance is left
    targetProximityPct: 80 # TARGET_NEAR when ≥ 80% of the way to the target
    bufferWarnPct: 70 # worst case uses ≥ 70% of a hard limit (incl. the trailing path)…
    bufferCriticalPct: 90 # …critical from 90%
    hysteresisPct: 5 # an alert clears only 5 points back on the safe side

# Market-data quality and OHLC bars (Phase 2). A quote-to-quote move above an instrument's
# maxQuoteJumpTicks makes its quotes INVALID (no new trades) for suspectCooldownMs.
marketData:
  suspectCooldownMs: 60000
  maxBarsPerSeries: 1000
  barCloseGraceMs: 2000

# Automatic protective closing (ADR-0014) — authorised by the owner on 2026-09-27. ASTRA closes
# positions by itself (risk-reducing only; never while an EXECUTION kill switch is active, never
# in SHADOW) when: a hard limit is flattenAtLimitUsagePct used at the current mark (and blocks the
# account), a position has no stop for unprotectedGraceMs, or the firm's flat time / weekly close
# is within flattenMinutesBeforeFlat. Every close is audited and raised as a CRITICAL event.
protection:
  enabled: true
  flattenAtLimitUsagePct: 90
  unprotectedGraceMs: 10000
  flattenMinutesBeforeFlat: 2
  maxCloseAttempts: 3

# Economic calendar (ADR-0011). No provider is chosen yet (owner input): windows arrive by push
# from n8n (POST /api/v1/calendar/window). With ASTRA_SIMULATION=true a SIMULATED weekly schedule
# is polled instead (paper tests only; refused in SHADOW and LIVE).
calendar:
  provider: none
  pollIntervalMs: 300000
  timeoutMs: 10000
  lookbackHours: 24
  lookaheadHours: 168

# Market-structure detection (ADR-0010). ASTRA's generic definitions — DEFAULTS, not strategy
# rules; review them with your strategy in Phase 5.
structure:
  swingStrength: 2 # bars on each side of a swing high/low
  equalLevelTicks: 2 # highs/lows this close count as equal (resting liquidity)…
  equalLevelAtrFraction: 0.1 # …widened to 10% of ATR(14) once known
  fvgMinTicks: 1 # smallest fair value gap reported
  maxItems: 20

# SIMULATED feeds for paper testing — used only when ASTRA_SIMULATION=true.
# Start prices are simulation seeds, NOT market data. SHADOW and LIVE refuse SIMULATED data.
simulation:
  quoteIntervalMs: 1000
  instruments:
    NQ: { startPrice: 20000, volatilityTicks: 4, spreadTicks: 1 }
    MNQ: { startPrice: 20000, volatilityTicks: 4, spreadTicks: 1 }
    XAUUSD: { startPrice: 2600, volatilityTicks: 15, spreadTicks: 20 }
