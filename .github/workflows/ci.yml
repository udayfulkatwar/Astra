name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format · Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra_ci_only
          POSTGRES_DB: astra_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astra -d astra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Setting this makes the database integration tests mandatory (they fail instead of skipping).
      TEST_DATABASE_URL: postgres://astra:astra_ci_only@localhost:5432/astra_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Dependency audit (report only)
        run: pnpm audit --prod || true
