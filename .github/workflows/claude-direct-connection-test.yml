name: Claude Direct Connection Test

on:
  push:
    branches:
      - claude-direct-connection-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connection-test:
    name: Direct Claude CLI OAuth test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Claude Code CLI
        run: |
          set -euo pipefail
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify Claude Code installation
        run: claude --version

      - name: Test Claude Pro OAuth connection directly
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          response="$(claude -p 'Reply with exactly CONNECTED and nothing else.' --max-turns 1 --output-format text)"
          echo "Claude response: $response"
          if [ "$response" != "CONNECTED" ]; then
            echo "Expected CONNECTED but received a different response."
            exit 1
          fi
