name: Claude Code Routine Bridge

on:
  issue_comment:
    types: [created]

jobs:
  fire-claude-routine:
    if: github.actor == github.repository_owner && contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Build CEO task payload
        shell: bash
        run: |
          python <<'PY'
          import json
          import os

          with open(os.environ['GITHUB_EVENT_PATH'], encoding='utf-8') as f:
              event = json.load(f)

          issue = event['issue']
          comment = event['comment']
          source_kind = 'pull_request_comment' if issue.get('pull_request') else 'issue_comment'

          text = f'''ASTRA CEO task received through the GitHub control plane.

Repository: {os.environ['GITHUB_REPOSITORY']}
Source: {source_kind}
Number: {issue['number']}
Requested by: {os.environ['GITHUB_ACTOR']}
Source URL: {comment.get('html_url', '')}

CEO instruction:
{comment.get('body', '')}

Operating rules:
- Work only on the ASTRA repository attached to this Claude Code routine.
- Inspect current repository and PR state before acting; do not assume earlier chat state is current.
- Preserve ASTRA's fail-closed, risk-first architecture.
- Never enable live trading, connect live accounts, expose credentials, or make irreversible production changes without explicit founder approval.
- For implementation tasks, test changes and leave auditable evidence in GitHub.
- Do not merge unless the instruction explicitly authorizes it.
'''

          payload = {'text': text[:65000]}
          with open('/tmp/claude-routine-payload.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f)
          with open('/tmp/target-number.txt', 'w', encoding='utf-8') as f:
              f.write(str(issue['number']))
          PY

      - name: Fire visible Claude Code cloud session
        id: fire
        shell: bash
        env:
          ROUTINE_FIRE_URL: ${{ secrets.CLAUDE_ROUTINE_FIRE_URL }}
          ROUTINE_FIRE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_FIRE_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${ROUTINE_FIRE_URL:-}" ] || [ -z "${ROUTINE_FIRE_TOKEN:-}" ]; then
            echo "::error::Claude routine secrets are missing."
            exit 1
          fi

          HTTP_CODE=$(curl --silent --show-error \
            --output /tmp/claude-routine-response.json \
            --write-out '%{http_code}' \
            --request POST "$ROUTINE_FIRE_URL" \
            --header "Authorization: Bearer $ROUTINE_FIRE_TOKEN" \
            --header 'anthropic-version: 2023-06-01' \
            --header 'Content-Type: application/json' \
            --data-binary @/tmp/claude-routine-payload.json)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Claude routine fire failed with HTTP $HTTP_CODE"
            jq -c '{type, error}' /tmp/claude-routine-response.json || true
            exit 1
          fi

          SESSION_URL=$(jq -r '.claude_code_session_url // empty' /tmp/claude-routine-response.json)
          SESSION_ID=$(jq -r '.claude_code_session_id // empty' /tmp/claude-routine-response.json)

          if [ -z "$SESSION_URL" ] || [ -z "$SESSION_ID" ]; then
            echo "::error::Claude routine response did not contain a session URL/ID."
            exit 1
          fi

          echo "session_url=$SESSION_URL" >> "$GITHUB_OUTPUT"
          echo "session_id=$SESSION_ID" >> "$GITHUB_OUTPUT"
          echo "Claude Code cloud session created: $SESSION_URL"
          printf '### Claude Code session created\n\n[%s](%s)\n' "$SESSION_ID" "$SESSION_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Post visible session link to the task thread
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SESSION_URL: ${{ steps.fire.outputs.session_url }}
          SESSION_ID: ${{ steps.fire.outputs.session_id }}
        run: |
          set -euo pipefail
          NUMBER=$(cat /tmp/target-number.txt)
          BODY="🤖 **Claude Code cloud session started**\n\nVisible session: $SESSION_URL\n\nSession ID: \`$SESSION_ID\`\n\nOpen the link to watch the task run in Claude Code on the web."

          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/issues/$NUMBER/comments" \
            -f body="$BODY" >/dev/null
